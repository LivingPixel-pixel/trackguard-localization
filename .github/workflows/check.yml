name: Source and release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install .
      - name: Test geometry and causal behavior
        run: python -m unittest discover -s tests -v
      - name: Run synthetic localization example
        run: python -m trackguard synthetic
      - name: Verify public assets and metric contract
        run: python scripts/check_release.py
